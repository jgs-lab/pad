<html>
	<script src="jquery-1.11.1.min.js"></script>
	<link rel="stylesheet" type="text/css" href="PADStyle.css">
	<title> PAD Validation </title>
	<body>
		<div id="container">
        	<div id="header">
        		<p>Pad Validation Page</p>
    		</div>
    
   	 		<div id="primary">
                <p>Select a video to watch</p>
        		<select class="videoSelect">
        			<option value="-1">Select a Video</option>
  					<option value="0">Video 1</option>
  					<option value="1">Video 2</option>
  					<option value="2">Video 3</option>
                    <option value="3">Video 4</option>
                    <option value="4">Video 5</option>
                    <option value="5">Video 6</option>
                    <option value="6">Video 7</option>
                    <option value="7">Video 8</option>
                    <option value="8">Video 9</option>
        		</select>
        		<button class="loadVideo"> Load Video </button>
    		</div>
    
    		<div id="content">
        		
    		</div>
    
    		<div id="secondary">
                <p>Admin Login</p>
                <input class= "adminInput"></input>
        		<button class="adminButton">Log In</button>
    		</div>
    
    		<div id="footer">
        		<div id="hiddenSection">
                    <p>Hidden Stuff</p>
                </div>
    		</div>
		</div>
		<script>
		  var emotionalVids = [
                "<center><embed width='420' height='315' src='http://www.youtube.com/v/QvD6maGRh7c'></center>",
                "<center><embed width='420' height='315' src='http://www.youtube.com/v/X0eso4ARXzk'></center>",
                "<center><embed width='420' height='315' src='http://www.youtube.com/v/inavo37kSOg'></center>",
                "<center><embed width='420' height='315' src='http://www.youtube.com/v/p_1-VFflpCI'></center>",
                "<center><embed width='420' height='315' src='http://www.youtube.com/v/W8SKL4fniRM'></center>",
                "<center><embed width='420' height='315' src='http://www.youtube.com/v/4N3N1MlvVc4'></center>",
                "<center><embed width='420' height='315' src='http://www.youtube.com/v/sMf2srQ065E'></center>",
                "<center><embed width='420' height='315' src='http://www.youtube.com/v/7usTgw-7XfM'></center>",
                "<center><embed width='420' height='315' src='http://www.youtube.com/v/I5wt302oph0'></center>"
          ]; // this is the hard coded section of videos pulled from the DEAP viedo Database. 

          $(".adminButton").click(function(){ // this is the admin login function
                if($(".adminInput").val() == "admin1"){
                    $("#hiddenSection").show();
                }else{
                    $("#hiddenSection").hide();
                }
          });

		  $(".loadVideo").click(function(){ // this is the load video function
                $("#content").html("");
				if($(".videoSelect").val() != -1){
                    $("#content").append(emotionalVids[$(".videoSelect").val()]);
                }
			});
            /*http://www.youtube.com/watch?v=QvD6maGRh7c Happy
            http://www.youtube.com/watch?v=X0eso4ARXzk Fun
            http://www.youtube.com/watch?v=inavo37kSOg Sexy
            http://www.youtube.com/watch?v=p_1-VFflpCI Calm
            http://www.youtube.com/watch?v=W8SKL4fniRM Sentimental 
            http://www.youtube.com/watch?v=4N3N1MlvVc4 Sad  
            http://www.youtube.com/watch?v=sMf2srQ065E Anger

            http://www.youtube.com/watch?v=I5wt302oph0 Horror
            This is the collection of videos that we are using along with the feeling assosiated with them
            */

		
		</script>
	</body>
</html>
