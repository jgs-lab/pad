<html>
	<script src="jquery-1.11.1.min.js"></script>
	<link rel="stylesheet" type="text/css" href="PADStyle.css">
	<title> PAD Validation </title>
	<body>
		<div id="container">
        	<div id="header">
        		<center><p>Pad Validation Page</p><center>
    		</div>
    
   	 		<div id="primary">
                <p>Select a video to watch</p>
        		<select class="videoSelect">
        			<option value="-1">Select a Video</option>
  					<option value="0">Video 0</option>
  					<option value="1">Video 1</option>
  					<option value="2">Video 2</option>
                    <option value="3">Video 3</option>
                    <option value="4">Video 4</option>
                    <option value="5">Video 5</option>
                    <option value="6">Video 6</option>
                    <option value="7">Video 7</option>
        		</select>
        		<button class="loadVideo"> Load Video </button>
                <div>
                    <button class="vidStop">
                        Press when Video Stops
                    </button>
                </div>
    		</div>
    
    		<div id="content">
        		
    		</div>
    
    		<div id="secondary">
                <p>Admin Login</p>
                <input class= "adminInput"></input>
        		<button class="adminButton">Log In</button>
    		</div>
    
    		<div id="footer">
        		<div id="hiddenSection">
                    <center><p>Data Tables</p></center>
                    <button class="csv"> Download as CSV</button>
                    <table class="dataTable" border="1">

                    </table>
                </div>
    		</div>
		</div>
		<script>
		  var videoData = {
            0: [],
            1: [],
            2: [],
            3: [],
            4: [],
            5: [],
            6: [],
            7: [],
            8: []
          }; // harcoded for testing will be gone. 
          var currVideo; // is the current video selected
          var stop = false; // variable that will stop the stream of information from the sensors 

          $(".adminButton").click(function(){ // this is the admin login function
                if($(".adminInput").val() == "admin1"){
                    $("#hiddenSection").show();
                    fillTable();
                }else{
                    $("#hiddenSection").hide();
                }
          });

		  $(".loadVideo").click(function(){ // this is the load video function
                var emotionalVids = [
                    "<center><iframe width='460' height='330' src='http://www.youtube.com/v/iZ9vkd7Rp-g?autoplay=1'></iframe></center>", // Fun 0
                    "<center><iframe width='460' height='330' src='http://www.youtube.com/v/51ncDQYxsm8?autoplay=1'></iframe></center>", // Exciting 1
                    "<center><iframe width='460' height='330' src='http://www.youtube.com/v/DqpFMqfeltE?autoplay=1'></iframe></center>", // Sexy 2
                    "<center><iframe width='460' height='330' src='http://www.youtube.com/v/B8eI64H1Cqk?autoplay=1'></iframe></center>", // Lovely 3
                    "<center><iframe width='460' height='330' src='http://www.youtube.com/v/4N3N1MlvVc4?autoplay=1'></iframe></center>", // Sad 4
                    "<center><iframe width='460' height='330' src='http://www.youtube.com/v/O0yoxveh7Tg?autoplay=1'></iframe></center>", // Terrible 5
                    "<center><iframe width='460' height='330' src='http://www.youtube.com/v/HdH8NYsDwWk?autoplay=1'></iframe></center>", // Hate 6
                    "<center><iframe width='460' height='330' src='http://www.youtube.com/v/wVyggTKDcOE?autoplay=1'></iframe></center>" // Sad 7
                ]; // this is the hard coded section of videos pulled from the DEAP viedo Database. 
                $("#content").html(""); // clears the last video from the content area
				if($(".videoSelect").val() != -1){
                    currVideo = $(".videoSelect").val(); // this will be used as the key for the videoData object. 
                    $("#content").append(emotionalVids[$(".videoSelect").val()]);
                     stop = true; // let the ajax call happen on intervals
                    var ajaxInterval = setInterval(function(){
                        $.ajax({
                            url: "interface.php", // calling the interface I made
                            type: "POST", // it is a GET 
                            dataType: "json", // data getting back will be a json
                            success: function(response){ // function with the response data
                                //console.log(response);
                                videoData[currVideo].push(response); // push the data onto the the current vido key on vidoData OBJ
                                //console.log(videoData); //for debugging
                                if(stop == false){ // if stop is set to false stop the interval repeating.
                                    clearInterval(ajaxInterval);
                                }
                            }
                        });
                    }, 2000); // repeate the interval every 2 seconds
                }
			});

            $(".vidStop").click(function(){ // button function to stop the ajax calls when the video is done.
                stop = false;
            });

            $(".csv").click(function(){ //button to download the data as CSV
               //window.open("interface.php?action="+JSON.stringify(videoData));
                var mapForm = document.createElement("form");
                mapForm.target = "Map";
                mapForm.method = "POST"; // or "post" if appropriate
                mapForm.action = "interface.php";

                var mapInput = document.createElement("input");
                mapInput.type = "text";
                mapInput.name = "action";
                mapInput.value = JSON.stringify(videoData);
                mapForm.appendChild(mapInput);

                document.body.appendChild(mapForm);

                map = window.open("", "Map", "status=0,title=0,height=600,width=800,scrollbars=1");

                if (map) {
                    mapForm.submit();
                } else {
                    alert('You must allow popups for this map to work.');
                }
            });
            
            function fillTable(){ // function for printing the tables with data out. 
                $(".dataTable").html(""); // clear the table of stale data
                $.each(videoData, function(key){
                    $(".dataTable").append("<tr class="+key+"><td>Video "+key+"</td></tr>");
                    for(var i = 0; i < this.length; i++){
                        $("."+key).append("<td>"+this[i]+"</td>");
                    }
                });
            }

		</script>
	</body>
</html>
